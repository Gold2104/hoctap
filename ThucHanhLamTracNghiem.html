<!DOCTYPE html>
<html lang="en">

<head></head>

<body>
    <script>
        // Khai báo biến
        let a = 10;
        let b = 3;

        // Toán tử số học
        document.write("Tổng:", a + b+ "<br>");
        document.write("Hiệu:", a - b + "<br>");
        document.write("Tích:", a * b + "<br>");
        document.write("Thương:", a / b + "<br>");

        // Kiểu dữ liệu
        let name = "Gig";
        let isStudent = true;

        document.write("Tên:", name+ "<br>");
        document.write("Có phải học viên không?", isStudent + "<br>");
      

        // Toán tử so sánh
        document.write("a > b:", a > b + "<br>");
        document.write("a == b:", a == b + "<br>");

        // Toán tử logic
        document.write("a > 5 && b < 5:", a > 5 && b < 5);

    </script>
</body>

</html>
